<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>byteCart</title>
  <link rel="icon" type="image/webp" href="icon-96.webp">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="bytecart_v2.css?v=6">
</head>

<body>
  <div id="loader">
    <img src="icon-96.webp" alt="ByteCart Logo" class="loader-logo">
    <div class="loader-name">Byte<i>Cart</i></div>
  </div>

  <nav class="nav" aria-label="Main">
    <a class="br" href="#home"><img src="icon-96.webp" alt="ByteCart Logo" style="height: 24px; width: 24px; margin-right: 6px; object-fit: contain;">Byte<i>Cart</i></a>
    <div class="links">
      <a class="l" href="#home" data-r="home">Home</a>
      <a class="l" href="#shop" data-r="shop">Shop</a>
      <a class="l" href="#map" data-r="map">Store map</a>
      <a class="l" href="#checkout" data-r="checkout">Checkout</a>
      <a class="l" href="#staff" data-r="staff">Staff <span id="nb"></span></a>
      <button class="l" style="text-align:left;background:none;border:none;border-bottom:1px solid var(--ln);width:100%;font-size:16px;cursor:pointer;" data-a="reset_tut">Reset Tutorial</button>
    </div>
    <button class="btn s" data-a="scan">Scan product</button>
    <button class="menu-btn" aria-label="Menu" aria-expanded="false">&#9776;</button>
  </nav>

  <main id="app"></main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" aria-label="Mobile Bottom Navigation">
    <a class="l" href="#home" data-r="home">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      Home
    </a>
    <a class="l" href="#shop" data-r="shop">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      Shop
    </a>
    <a class="l" href="#map" data-r="map">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Map
    </a>
    <a class="l" href="#checkout" data-r="checkout">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Cart
    </a>
  </nav>

  <div id="toasts" aria-live="polite"></div>
  <div id="modal" role="dialog" aria-modal="true"></div>

  <script src="bytecart_v2.js?v=4"></script>

  <script>
    // Loading screen
    window.addEventListener('load', function () {
      setTimeout(function () {
        var l = document.getElementById('loader');
        l.classList.add('hide');
        setTimeout(function () { l.remove(); }, 500);
      }, 1500);
    });

    // Mobile menu
    (function () {
      var nav = document.querySelector('.nav');
      var btn = document.querySelector('.menu-btn');
      function setOpen(open) {
        nav.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open);
        btn.innerHTML = open ? '&#10005;' : '&#9776;';
      }
      btn.addEventListener('click', function () {
        setOpen(!nav.classList.contains('open'));
      });
      document.querySelectorAll('.nav .l').forEach(function (a) {
        a.addEventListener('click', function () { setOpen(false); });
      });
    })();
  </script>
</body>

</html>
